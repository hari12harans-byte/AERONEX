feature_version: fv1

delay_model:
  # "Significant delay" threshold. 15 min is a common on-time-performance convention;
  # confirm it matches the definition you want. It is configuration, not a finding.
  significant_delay_threshold_min: 15
  max_abs_delay_min: 1440            # |delay| above this is treated as invalid and moved to removed_rows.csv
  features: [airline, origin_airport, destination_airport, hour_of_day, day_of_week, month,
             is_weekend, is_peak_hour, flight_distance_km, scheduled_duration_min]

connection_model:
  min_connection_min: 30             # scenario builder: smallest scheduled gap between real schedule rows
  max_connection_min: 360
  same_airline_only: true
  # What to do when flight A has no OBSERVED arrival delay (schedule-only data):
  #   exclude     -> drop those scenarios (original behaviour)
  #   assume_zero -> set arrival delay to 0 and mark arrival_delay_source = assumed_zero (PLANNED-schedule scenarios;
  #                  the model then learns nothing about delays). Never random.
  no_observed_delay_policy: assume_zero
  max_pairs_per_airport_day: 40      # seeded sample cap, documented in the build report
  sample_seed: 42
  # label_mode: derived_deterministic  -> missed = (buffer < 0)                       [DERIVED PROTOTYPE LABEL]
  #             experimental_stochastic -> missed = (realised_required > available)    [SYNTHETIC / EXPERIMENTAL]
  label_mode: derived_deterministic
  stochastic_sigma: 0.25             # log-normal spread used only by experimental_stochastic
  features: [arrival_delay_min, connection_time_min, deplaning_min, gate_walk_min, security_time_min,
             immigration_time_min, boarding_cutoff_min, gate_change, terminal_change, weather_risk,
             airport_congestion, hour_of_day, day_of_week, is_weekend, is_peak_hour,
             available_time_min, required_time_min, connection_buffer_min]
  default_deplaning_min: 10

common:
  peak_hours: [6, 7, 8, 9, 17, 18, 19, 20, 21]
  split: {train: 0.70, validation: 0.15, test: 0.15}   # temporal when timestamps allow
  random_state: 42
  decision_threshold: 0.5
  min_recall_target: 0.80            # model selection: best PR-AUC among models meeting this recall on validation
  calibrate: true
  calibration_method: sigmoid        # sigmoid | isotonic
  search: {enabled: false, n_iter: 8, cv_splits: 3}

# Probability bands for the ML-only risk label. Configurable; NOT calibrated thresholds.
risk_bands: {medium: 0.20, high: 0.50, critical: 0.85}
